<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Media Addiction Intelligence</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #0f766e;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Aptos", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 20%, #eaf7ff 0%, var(--bg) 48%);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: linear-gradient(125deg, #0f766e, #0f4c81);
      color: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero h1 { margin: 0 0 8px; font-size: 30px; }
    .hero p { margin: 0; color: #d1fae5; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .metric-label { margin: 0; color: var(--muted); font-size: 13px; }
    .metric-value { margin: 8px 0 0; font-size: 25px; font-weight: 700; }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 14px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .chart-card h2 {
      margin: 2px 0 12px;
      font-size: 18px;
      color: #0f4c81;
    }
  </style>
</head>

            <article class="metric-card">

                <p class="metric-value">7.00</p>
            </article>
            

            <article class="metric-card">
                <p class="metric-label">Highest-Risk Country</p>
                <p class="metric-value">Tanzania</p>
            </article>
